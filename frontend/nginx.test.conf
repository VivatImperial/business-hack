server {
    listen 80;
    server_name pulsar-tg-test.ru www.pulsar-tg-test.ru _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pulsar-tg-test.ru www.pulsar-tg-test.ru _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/pulsar-tg-test.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsar-tg-test.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
