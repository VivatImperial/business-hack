[project]
name = "baltiyskiy-bereg-starter"
version = "0.1.0"
description = "Baltiyskiy Bereg service-desk chatbot starter — AI Business SPB Hackathon 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
    "html-to-markdown>=3.2.3",
    "pymssql>=2.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.67.3",
    "torch>=2.11.0",
    "transformers>=5.5.4",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy>=2.0.49",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "email-validator>=2.3.0",
    "greenlet>=3.4.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "qdrant-client>=1.17.1",
    "python-multipart>=0.0.26",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
]
