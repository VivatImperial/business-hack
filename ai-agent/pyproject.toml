[project]
name = "baltiyskiy-bereg-ai-agent"
version = "0.1.0"
description = "AI agent service for Baltiyskiy Bereg service-desk assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx",
    "qdrant-client",
    "pymssql",
    "python-dotenv",
    "requests",
    "html-to-markdown",
    "tqdm",
    "torch",
    "transformers",
    "sqlalchemy>=2.0.49",
    "aiosqlite>=0.22.1",
    "pyjwt>=2.12.1",
    "email-validator>=2.3.0",
]

[project.scripts]
ai-agent = "ai_agent.main:main"
ai-agent-index-exports = "ai_agent.cli.index_from_exports:main"
ai-agent-index-mssql = "ai_agent.cli.index_from_mssql:main"
ai-agent-rebuild-collections = "ai_agent.cli.rebuild_collections:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_agent*"]
